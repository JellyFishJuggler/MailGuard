[project]
name = "mailguard"
version = "0.1.0"
description = "Human in the loop email agent that needs approval before sending"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.1.0",
    "langchain-google-genai>=2.1.0",
    "langchain-xai>=0.2.5",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mailguard = "mailguard.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
